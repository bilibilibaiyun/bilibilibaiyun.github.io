<html lang="zh-CN" data-theme="dark">

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#07070d;
  --bg-elev:#0d0d16;
  --surface:rgba(255,255,255,.035);
  --surface-hover:rgba(255,255,255,.06);
  --border:rgba(255,255,255,.08);
  --border-strong:rgba(255,255,255,.14);
  --text:#f4f4f6;
  --text2:#9aa0ad;
  --text3:#626a78;
  --c1:#6d5efc;
  --c2:#3b82f6;
  --c3:#ec4899;
  --grad:linear-gradient(135deg,#6d5efc,#3b82f6);
  --grad-text:linear-gradient(135deg,#8b7bff,#60a5fa);
  --shadow:0 20px 50px -20px rgba(0,0,0,.7);
  --glow1:rgba(109,94,252,.22);
  --glow2:rgba(59,130,246,.16);
  --glow3:rgba(236,72,153,.10);
  --radius:18px;
  --radius-lg:22px;
}
[data-theme="light"]{
  --bg:#f7f7fb;
  --bg-elev:#ffffff;
  --surface:rgba(255,255,255,.72);
  --surface-hover:#ffffff;
  --border:rgba(17,24,39,.08);
  --border-strong:rgba(17,24,39,.14);
  --text:#1f2430;
  --text2:#5b6472;
  --text3:#9aa1ad;
  --c1:#6d5efc;
  --c2:#3b82f6;
  --c3:#ec4899;
  --grad:linear-gradient(135deg,#6d5efc,#3b82f6);
  --grad-text:linear-gradient(135deg,#6d5efc,#3b82f6);
  --shadow:0 20px 45px -24px rgba(60,60,140,.22);
  --glow1:rgba(109,94,252,.14);
  --glow2:rgba(59,130,246,.12);
  --glow3:rgba(236,72,153,.08);
}
html{scrollbar-color:rgba(128,128,160,.25) transparent}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;overflow-x:hidden;
  transition:background .35s,color .35s;
}

/* ===== 背景光晕 ===== */
.bg-glow{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-glow::before,.bg-glow::after{content:'';position:absolute;border-radius:50%;filter:blur(120px)}
.bg-glow::before{width:60vw;height:60vw;top:-25vw;left:-12vw;background:radial-gradient(circle,var(--glow1),transparent 70%)}
.bg-glow::after{width:55vw;height:55vw;bottom:-22vw;right:-10vw;background:radial-gradient(circle,var(--glow2),transparent 70%)}
.bg-glow .g3{position:absolute;width:40vw;height:40vw;top:40%;left:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,var(--glow3),transparent 70%);filter:blur(110px)}

/* ===== 布局 ===== */
.app{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 28px 60px}

/* ===== 顶部导航 ===== */
header{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:18px;
  padding:16px 0;margin:0 -28px;padding-left:28px;padding-right:28px;
  backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  background:linear-gradient(to bottom,var(--bg) 60%,transparent);
}
.brand{display:flex;align-items:center;gap:12px;flex-shrink:0}
.brand .logo{
  width:40px;height:40px;border-radius:12px;overflow:hidden;
  background:var(--grad);display:flex;align-items:center;justify-content:center;
  font-size:22px;box-shadow:0 8px 22px -8px rgba(109,94,252,.7);flex-shrink:0
}
.brand .logo img{width:100%;height:100%;object-fit:cover}
.brand .brand-text{line-height:1.15}
.brand .brand-text h1{font-size:17px;font-weight:800;letter-spacing:.3px;background:var(--grad-text);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.brand .brand-text span{font-size:11px;color:var(--text3);display:block;margin-top:2px}

.search-wrap{flex:1;max-width:440px;position:relative;margin-left:auto}
.search-wrap input{
  width:100%;padding:10px 16px 10px 40px;background:var(--surface);
  border:1px solid var(--border);border-radius:99px;color:var(--text);font-size:14px;
  outline:none;transition:all .25s;backdrop-filter:blur(10px)
}
.search-wrap input::placeholder{color:var(--text3)}
.search-wrap input:focus{border-color:var(--c1);box-shadow:0 0 0 4px rgba(109,94,252,.15);background:var(--surface-hover)}
.search-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;pointer-events:none}
.kbd{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  font-size:10px;color:var(--text3);background:var(--surface);
  border:1px solid var(--border);border-radius:6px;padding:2px 6px;pointer-events:none
}
.theme-btn{
  width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:var(--surface);border:1px solid var(--border);color:var(--text2);font-size:17px;cursor:pointer;
  transition:all .25s;flex-shrink:0
}
.theme-btn:hover{background:var(--surface-hover);border-color:var(--border-strong);transform:translateY(-1px)}

/* ===== 主 tab ===== */
.main-tabs{display:flex;gap:6px;margin:26px 0 18px}
.main-tab{
  padding:10px 22px;border-radius:99px;font-size:15px;font-weight:700;cursor:pointer;
  color:var(--text2);border:1px solid transparent;transition:all .25s;background:transparent
}
.main-tab:hover{color:var(--text);background:var(--surface)}
.main-tab.active{background:var(--grad);color:#fff;box-shadow:0 8px 24px -8px rgba(109,94,252,.55)}

/* ===== 分类 pills ===== */
.pills{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:30px}
.pill{
  padding:8px 18px;border-radius:99px;font-size:13px;font-weight:600;cursor:pointer;
  color:var(--text2);background:var(--surface);border:1px solid var(--border);transition:all .22s
}
.pill:hover{color:var(--text);border-color:var(--border-strong);transform:translateY(-1px)}
.pill.active{color:#fff;background:var(--grad);border-color:transparent;box-shadow:0 8px 20px -8px rgba(109,94,252,.5)}
.pill .cnt{opacity:.72;font-weight:500;margin-left:4px}

/* ===== 内容头部 ===== */
.section-head{margin-bottom:22px}
.section-head h2{font-size:26px;font-weight:800;letter-spacing:.3px;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.section-head p{color:var(--text2);font-size:14px}
.section-head .stat{display:inline-block;margin-top:10px;font-size:12px;color:var(--text3);background:var(--surface);border:1px solid var(--border);padding:4px 12px;border-radius:99px}
.section-head .stat b{color:var(--c1)}

/* ===== 卡片网格 ===== */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:22px;cursor:pointer;transition:all .25s cubic-bezier(.2,.7,.3,1);display:flex;flex-direction:column;
  position:relative;overflow:hidden;backdrop-filter:blur(12px)
}
.card::after{
  content:'';position:absolute;inset:0;opacity:0;transition:opacity .3s;pointer-events:none;
  background:radial-gradient(120% 80% at 50% 0%,rgba(109,94,252,.14),transparent 60%)
}
.card:hover{transform:translateY(-4px);border-color:var(--border-strong);box-shadow:var(--shadow);background:var(--surface-hover)}
.card:hover::after{opacity:1}
.card-icon{
  width:52px;height:52px;border-radius:14px;margin-bottom:16px;
  background:linear-gradient(135deg,rgba(109,94,252,.16),rgba(59,130,246,.16));
  border:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;
  font-size:27px;position:relative;z-index:1
}
.card-name{font-size:15.5px;font-weight:700;margin-bottom:7px;position:relative;z-index:1;line-height:1.4}
.card-desc{font-size:12.5px;color:var(--text2);line-height:1.6;flex:1;position:relative;z-index:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-foot{margin-top:14px;display:flex;align-items:center;gap:6px;position:relative;z-index:1;flex-wrap:wrap}
.card-tag{font-size:10.5px;color:var(--c2);background:rgba(59,130,246,.13);display:inline-block;padding:2.5px 9px;border-radius:99px;font-weight:600}
.card-stars{font-size:10.5px;color:#f59e0b;background:rgba(245,158,11,.13);padding:2.5px 9px;border-radius:99px;font-weight:700}
.card-ext{position:absolute;top:16px;right:18px;color:var(--text3);font-size:13px;opacity:0;transition:all .25s;z-index:1}
.card:hover .card-ext{opacity:1;transform:translateX(-2px)}
.card.web .card-icon{background:linear-gradient(135deg,rgba(236,72,153,.16),rgba(109,94,252,.16))}
.card.web .card-tag{color:var(--c3);background:rgba(236,72,153,.13)}

.empty-state{text-align:center;padding:80px 20px;color:var(--text3)}
.empty-state .empty-icon{font-size:60px;margin-bottom:18px;opacity:.7}
.empty-state p{font-size:14px}

/* ===== 弹窗 ===== */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(12px);
  z-index:1000;display:none;align-items:center;justify-content:center;padding:22px
}
.modal-overlay.active{display:flex}
.modal{
  background:var(--bg-elev);border:1px solid var(--border-strong);border-radius:var(--radius-lg);
  max-width:480px;width:100%;padding:36px 32px 28px;position:relative;animation:modalIn .28s cubic-bezier(.2,.7,.3,1);
  max-height:90vh;overflow-y:auto;box-shadow:0 30px 80px -20px rgba(0,0,0,.6)
}
[data-theme="light"] .modal{background:#fff}
@keyframes modalIn{from{transform:scale(.94) translateY(20px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.modal-close{
  position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;
  border:none;background:var(--surface);color:var(--text2);font-size:15px;cursor:pointer;
  transition:all .2s;display:flex;align-items:center;justify-content:center
}
.modal-close:hover{background:var(--c3);color:#fff}
.modal-head{text-align:center;margin-bottom:18px}
.modal-icon{
  width:78px;height:78px;border-radius:20px;margin:0 auto 16px;
  background:linear-gradient(135deg,rgba(109,94,252,.18),rgba(59,130,246,.18));
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:42px
}
.modal-title{font-size:22px;font-weight:800;margin-bottom:8px}
.modal-stars{display:inline-block;font-size:11px;color:#f59e0b;background:rgba(245,158,11,.13);padding:3px 12px;border-radius:99px;font-weight:700;margin-bottom:12px}
.modal-desc{color:var(--text2);font-size:14px;line-height:1.75;margin-bottom:24px;text-align:left}
.modal-btns{display:flex;gap:10px;flex-direction:column}
.mbtn{
  padding:13px 20px;border-radius:14px;border:none;font-size:14px;font-weight:700;
  cursor:pointer;transition:all .22s;text-decoration:none;text-align:center;
  display:flex;align-items:center;justify-content:center;gap:8px
}
.mbtn-primary{background:var(--grad);color:#fff;box-shadow:0 10px 26px -10px rgba(109,94,252,.55)}
.mbtn-primary:hover{transform:translateY(-1px);box-shadow:0 14px 30px -10px rgba(109,94,252,.65)}
.mbtn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.mbtn-secondary:hover{background:var(--surface-hover);border-color:var(--border-strong)}
.mbtn-ghost{background:transparent;color:var(--text2);border:1px dashed var(--border-strong)}
.mbtn-ghost:hover{color:var(--text);border-color:var(--text3)}

footer{
  margin-top:60px;padding-top:24px;border-top:1px solid var(--border);
  text-align:center;font-size:12px;color:var(--text3);line-height:2
}
footer a{color:var(--c1);text-decoration:none;font-weight:600}

/* ===== 响应式 ===== */
@media(max-width:720px){
  .app{padding:0 18px 48px}
  header{padding-left:18px;padding-right:18px;margin:0 -18px;gap:12px}
  .brand-text span{display:none}
  .search-wrap{max-width:none}
  .kbd{display:none}
  .card-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .card{padding:17px}
  .section-head h2{font-size:21px}
}
@media(max-width:430px){
  .card-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .card-name{font-size:13.5px}
  .card-desc{font-size:11.5px}
  .card-icon{width:44px;height:44px;font-size:23px;margin-bottom:12px}
  .main-tab{padding:9px 18px;font-size:14px}
}
</style>

    });
  } else {
    html += `<div class="pill${activeSub==='__all__'?' active':''}" onclick="selectSub('__all__')">全部<span class="cnt">${WEBSITES.length}</span></div>`;
    WEB_SUBS.forEach(sub => {
      const n = WEBSITES.filter(w => w.sub === sub).length;
      html += `<div class="pill${activeSub===sub?' active':''}" onclick="selectSub('${sub}')">${sub}<span class="cnt">${n}</span></div>`;
    });
  }
  pills.innerHTML = html;
}

function switchTab(tab){
  activeTab = tab;
  searchQuery = ''; $('search-input').value = '';
  $('tab-tools').classList.toggle('active', tab==='tools');
  $('tab-web').classList.toggle('active', tab==='web');
  renderPills();
  renderContent();
}
function selectCat(cat){ activeCat = cat; searchQuery=''; $('search-input').value=''; renderPills(); renderContent(); }
function selectSub(sub){ activeSub = sub; searchQuery=''; $('search-input').value=''; renderPills(); renderContent(); }

function getItems(){
  if(searchQuery){
    const q = searchQuery.toLowerCase();
    const all = [...TOOLS, ...WEBSITES.map(w => ({...w, type:'web'}))];
    return all.filter(i =>
      (i.name||'').toLowerCase().includes(q) ||
      (i.desc||'').toLowerCase().includes(q) ||
      (i.cat||'').toLowerCase().includes(q) ||
      (i.sub||'').toLowerCase().includes(q)
    );
  }
  if(activeTab === 'web'){
    return activeSub === '__all__' ? WEBSITES : WEBSITES.filter(w => w.sub === activeSub);
  }
  return TOOLS.filter(t => t.cat === activeCat);
}

function renderContent(){
  const items = getItems();
  const isSearching = searchQuery !== '';
  let title, desc;
  if(isSearching){ title = '🔍 搜索结果'; desc = '「' + searchQuery + '」的搜索结果'; }
  else if(activeTab === 'web'){ title = activeSub === '__all__' ? '全部网站' : activeSub; desc = '精选实用网站，按分类整理'; }
  else { title = activeCat; desc = CAT_DESC[activeCat] || ''; }
  $('cat-title').textContent = title;
  $('cat-desc').textContent = desc;
  const unit = (isSearching || activeTab==='web') ? '个结果' : '个工具';
  $('cat-stat').innerHTML = '共 <b>' + items.length + '</b> ' + unit;

  const grid = $('card-grid');
  const empty = $('empty-state');
  if(items.length === 0){ grid.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';

  grid.innerHTML = items.map(item => {
    if(item.type === 'web'){
      return `<div class="card web" onclick="window.open('${item.url}','_blank')">
        <span class="card-ext">🔗</span>
        <div class="card-icon">${item.icon}</div>
        <div class="card-name">${item.name}</div>
        <div class="card-desc">${item.desc}</div>
        <div class="card-foot"><span class="card-tag">${item.sub}</span></div>
      </div>`;
    }
    const stars = item.stars ? `<span class="card-stars">⭐ ${item.stars}</span>` : '';
    return `<div class="card" onclick="openTool(${item.id})">
      <span class="card-ext">⬇️</span>
      <div class="card-icon">${item.icon}</div>
      <div class="card-name">${item.name}</div>
      <div class="card-desc">${item.desc}</div>
      <div class="card-foot"><span class="card-tag">${item.cat}</span>${stars}</div>
    </div>`;
  }).join('');
}

function openTool(id){
  const item = TOOLS.find(t => t.id === id);
  if(!item) return;
  $('modal-icon').textContent = item.icon;
  $('modal-title').textContent = item.name;
  const stars = $('modal-stars');
  if(item.stars){ stars.style.display='inline-block'; stars.textContent='⭐ GitHub ' + item.stars + ' Stars'; }
  else stars.style.display='none';
  $('modal-desc').textContent = item.desc;

  let btns = '';
  if(item.downloads && item.downloads.length){
    item.downloads.forEach(d => { btns += `<a class="mbtn mbtn-primary" href="${d.url}" target="_blank" rel="noopener">⬇️ ${d.label}</a>`; });
  }
  if(item.github){
    btns += `<a class="mbtn mbtn-secondary" href="${item.github}" target="_blank" rel="noopener">🐙 查看 GitHub 项目</a>`;
  }
  if(item.video){
    btns += `<a class="mbtn mbtn-ghost" href="https://www.bilibili.com/video/${item.video}" target="_blank" rel="noopener">📺 观看视频教程</a>`;
  }
  $('modal-btns').innerHTML = btns;
  $('modal').classList.add('active');
}

function closeModal(e){
  if(e && e.target !== $('modal')) return;
  $('modal').classList.remove('active');
}

function doSearch(){ searchQuery = $('search-input').value.trim(); renderContent(); }

function toggleTheme(){
  const html = document.documentElement;
  const btn = $('theme-btn');
  const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  btn.textContent = next === 'dark' ? '🌙' : '☀️';
  try { localStorage.setItem('byg_theme', next); } catch(e){}
}

document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){
    const modal = $('modal');
    if(modal.classList.contains('active')){ modal.classList.remove('active'); return; }
    $('search-input').value = ''; searchQuery = ''; renderContent();
  }
  if(e.ctrlKey && e.key === 'k'){ e.preventDefault(); $('search-input').focus(); }
});

// 初始化
try {
  const saved = localStorage.getItem('byg_theme');
  if(saved){ document.documentElement.setAttribute('data-theme', saved); $('theme-btn').textContent = saved === 'dark' ? '🌙' : '☀️'; }
} catch(e){}

renderPills();
renderContent();
</script>
</body>
</html>
